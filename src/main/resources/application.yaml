spring:
  application:
    name: patient-booking
  profiles:
    # Used when no profile is set; override with SPRING_PROFILES_ACTIVE
    default: local
  datasource:
    # Set DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PWD as environment variables when deployed.
    # prepareThreshold=0 is required behind a transaction-mode pooler (Supabase/PgBouncer)
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?prepareThreshold=0
    username: ${DB_USER}
    password: ${DB_PWD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      # This clears any cached prepared statements before reusing the connection.
      connection-init-sql: "DISCARD ALL"
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      jdbc:
        time_zone: UTC
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Creates the appointment_service schema if it doesn't exist yet
        hbm2ddl:
          create_namespaces: true

logging:
  level:
    root: info
    com.patient_booking: info

server:
  port: ${PORT:8080}
